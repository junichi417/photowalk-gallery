<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>写真帖 ギャラリー</title>
  <meta name="description" content="時譜舎 写真帖の写真ギャラリー">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;900&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <p class="proto-note" id="proto-note" hidden>試作版：掲載している写真と名前はすべて仮のものです</p>

  <div class="layout">
    <header class="spine">
      <div class="mast">
        <h1 class="title"><span id="ev-title">　</span><small id="ev-subtitle"></small></h1>
        <p class="dates" id="ev-dates"></p>
      </div>

      <div class="submit">
        <p class="status" id="status" aria-live="polite"></p>
        <a class="post-btn" id="post-btn" href="post.html" aria-disabled="true">写真を投稿する</a>
      </div>

      <nav class="people" aria-label="撮影者で絞り込む">
        <ul id="people"></ul>
      </nav>
    </header>

    <main class="gallery">
      <p class="count" id="count" aria-live="polite"></p>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>まだ写真がありません。最初の1枚を投稿してみてください。</p>
    </main>
  </div>

  <footer class="foot">
    <span id="site-name"></span>
    <span>写真の著作権は各撮影者にあります</span>
  </footer>

  <dialog class="viewer" id="viewer" aria-label="写真を拡大表示">
    <div class="viewer-stage">
      <img id="viewer-img" alt="">
    </div>
    <div class="viewer-bar">
      <p class="viewer-who" id="viewer-who"></p>
      <p class="viewer-pos" id="viewer-pos"></p>
      <div class="viewer-nav">
        <button type="button" id="prev" aria-label="前の写真">‹</button>
        <button type="button" id="next" aria-label="次の写真">›</button>
        <button type="button" id="close" aria-label="閉じる">×</button>
      </div>
    </div>
  </dialog>

  <script src="assets/app.js" defer></script>
</body>
</html>
