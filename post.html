<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>写真を投稿する</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .post { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
    .post h1 { font-size: 22px; margin: 0 0 16px; }
  </style>
</head>
<body>
  <main class="post">
    <h1>写真を投稿する</h1>
    <!-- 次の段階でここに「合言葉 → メール認証 → 表示名・SNS → 同意 → アップロード」の画面が入る -->
    <p class="status" id="status">写真の受付は準備中です</p>
    <p><a href="./">ギャラリーに戻る</a></p>
  </main>
  <script>
    // 表示だけの判定。投稿の可否は常にサーバー側で判定する
    (async () => {
      try {
        const site = await (await fetch("site.json")).json();
        const q = new URLSearchParams(location.search).get("e");
        const slug = q && /^[a-z0-9-]{1,64}$/.test(q) ? q : site.default_event;
        const ev = await (await fetch(`events/${slug}/event.json`)).json();
        const s = document.getElementById("status");
        if (Date.now() > Date.parse(ev.submission_deadline)) {
          s.textContent = "写真の受付は終了しました";
          s.classList.add("closed");
        } else {
          s.textContent = `写真の受付は準備中です（締切 ${ev.submission_deadline_label}）`;
        }
      } catch { /* 読めなければ初期表示のまま */ }
    })();
  </script>
</body>
</html>
