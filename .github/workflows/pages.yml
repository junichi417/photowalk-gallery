# GitHub Pages への公開（手動実行のみ）
#
# - push では動かない。Actions タブの「Run workflow」からだけ公開できる
# - 公開前に、環境 github-pages の「承認者」(社長)が承認するまで止まる設定を推奨（docs/PUBLISH.md）
# - 履歴を持たない成果物(artifact)を公開するので、gh-pages ブランチの強制上書きは不要
#   → 削除依頼で消した写真が、公開側の履歴に残らない
name: publish-pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish=複数イベントの同時公開(通常はこちら) / live・archive=1イベントだけの公開"
        type: choice
        options: [publish, live, archive]
        default: publish
      plan:
        description: "publish 用: イベントごとに slug:live または slug:archive をカンマ区切りで"
        type: string
        default: "izu-oshima-2026:archive,shodoshima-2026:live"
      event:
        description: "live・archive 用の対象イベントの slug(空なら site.json の default_event)"
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: サイトを作る
        run: |
          URL=$(python -c "import json;print(json.load(open('site.json'))['supabase']['url'])")
          KEY=$(python -c "import json;print(json.load(open('site.json'))['supabase']['anon_key'])")
          if [ "${{ inputs.mode }}" = "publish" ]; then
            python tools/build_site.py publish --plan "${{ inputs.plan }}" --url "$URL" --anon-key "$KEY"
          elif [ -n "${{ inputs.event }}" ]; then
            python tools/build_site.py "${{ inputs.mode }}" --url "$URL" --anon-key "$KEY" --event "${{ inputs.event }}"
          else
            python tools/build_site.py "${{ inputs.mode }}" --url "$URL" --anon-key "$KEY"
          fi
      - name: 公開前の安全確認(秘密鍵・個人情報)
        run: |
          if grep -rqiE 'service_role|sb_secret_|app.?password|BEGIN (RSA |EC )?PRIVATE' dist; then
            echo "dist に秘密鍵らしき文字列があります。公開を中止します" >&2; exit 1
          fi
          if grep -rqE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' dist --include=*.html --include=*.js --include=*.json; then
            echo "dist にメールアドレスらしき文字列があります。確認してください" >&2; exit 1
          fi
          # 画像の許可は置き場所で決める（モードでは決めない。同時公開でも同じ強さにする）:
          #   サイトのトップ写真 / 各イベントのトップ写真・OGP画像 / 伊豆大島の静的版の写真だけ。
          #   伊豆大島以外のイベントの写真や、それ以外の場所の画像が混ざっていたら止める。
          if find dist -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) ! -path 'dist/assets/hero.jpg' ! -path 'dist/events/*/hero.jpg' ! -path 'dist/events/*/ogp.jpg' ! -path 'dist/events/izu-oshima-2026/photos/*' | grep -q .; then
            echo "許可されていない画像ファイルが dist に入っています(許可: トップ写真 assets/hero.jpg / イベントのトップ写真・OGP画像 events/*/hero.jpg・events/*/ogp.jpg / 伊豆大島の静的版の写真 events/izu-oshima-2026/photos/ だけ)。公開を中止します" >&2; exit 1
          fi
          echo "公開するファイル:"; find dist -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
